name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + testes, incluindo segurança)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências
        run: |
          pip install -r backend/requirements.txt
          pip install --no-deps -e backend
      - name: Lint
        working-directory: backend
        run: ruff check ultron tests
      - name: Scripts de implantação (shellcheck)
        run: shellcheck -S error deploy/oracle/*.sh scripts/*.sh
      - name: Testes
        working-directory: backend
        run: python -m pytest -q

  backend-postgres:
    name: Backend no PostgreSQL (Supabase)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ultron
          POSTGRES_PASSWORD: ultron
          POSTGRES_DB: ultron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ultron" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install -r backend/requirements.txt
          pip install --no-deps -e backend
      - name: Testes contra PostgreSQL
        working-directory: backend
        env:
          ULTRON_TEST_DATABASE_URL: postgresql://ultron:ultron@127.0.0.1:5432/ultron_test
        run: python -m pytest -q

  frontend:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

  windows-scripts:
    name: Scripts do Windows (notebook)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe e funções no Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem scripts\windows\*.ps1) {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs.Count) { $errs | ForEach-Object { Write-Host "$($f.Name):$($_.Extent.StartLineNumber) $($_.Message)" }; exit 1 }
            Write-Host "$($f.Name): sintaxe ok"
          }
          if ((Get-Content scripts\windows\iniciar.ps1 -Raw) -notmatch 'Configuração criada') { throw 'acentos lidos errado (BOM?)' }
          foreach ($b in 'INICIAR', 'ATUALIZAR', 'PARAR') {
            if (-not (Test-Path "$b-ULTRON.bat")) { throw "falta $b-ULTRON.bat" }
          }
          Set-Content .env "COMPOSE_PROFILES=celular`nULTRON_SETUP_TOKEN=abc123" -Encoding ASCII
          . .\scripts\windows\comum.ps1
          if ((Novo-Segredo 32).Length -ne 64) { throw 'segredo com tamanho errado' }
          if ((Novo-Segredo 32) -eq (Novo-Segredo 32)) { throw 'segredo repetido' }
          if ((Ler-Env 'ULTRON_SETUP_TOKEN') -ne 'abc123') { throw 'Ler-Env falhou' }
          if ((Ler-Env 'NAO_EXISTE') -ne '') { throw 'Ler-Env deveria vir vazio' }
          Write-Host 'funções ok'

  governance-guard:
    name: Guarda de governança (PRs do ULTRON)
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'evolution/') || startsWith(github.head_ref, 'rollback/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regras carregadas do branch BASE (o PR não altera quem o avalia)
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          PYTHONPATH=/tmp/base/backend python -m ultron.governance.ci_guard "origin/${{ github.base_ref }}" HEAD
