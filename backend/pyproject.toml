[project]
name = "ultron"
version = "0.1.0"
description = "ULTRON — plataforma de inteligência artificial autônoma, multiagente e autoevolutiva"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "beautifulsoup4>=4.12",
  "anthropic>=2.0",
  # usados em produção pelo Evaluation Engine (testes e lint no sandbox)
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ultron*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501", "S101", "S603", "S607", "B008", "S311", "S110", "S112", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
